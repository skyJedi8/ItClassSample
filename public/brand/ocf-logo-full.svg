    <text x="730" y="240" font-size="56" font-weight="700" letter-spacing="5">EXTERIOR CLEANING</text>
    <text x="730" y="286" font-size="38" font-weight="600" letter-spacing="3">VETERAN OWNED &amp; OPERATED | HOUSTON, TX</text>
