      <stop offset="0%" stop-color="#6dd5ff"/>
      <stop offset="100%" stop-color="#22b8f0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#020617" flood-opacity="0.55"/>
